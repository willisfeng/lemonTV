name: Auto Sync IPTV with Email

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync-and-notify:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout your repo
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.PAT_TOKEN }}
    
    - name: Check current file hash
      id: hash_check
      run: |
        if [ -f "iptv-fe.m3u" ]; then
          OLD_HASH=$(sha256sum iptv-fe.m3u | awk '{print $1}')
          echo "old_hash=$OLD_HASH" >> $GITHUB_OUTPUT
        else
          echo "old_hash=none" >> $GITHUB_OUTPUT
        fi
    
    # 下载 → 修正 cctv 文件格式 → 合并
    - name: Download, fix and merge source files
      id: download
      run: |
        # 下载两个源文件
        curl -s -L -o migu.m3u "https://raw.githubusercontent.com/willisfeng/migu_video1/main/migu.m3u"
        curl -s -L -o cctv_raw.m3u "https://raw.githubusercontent.com/willisfeng/migu_video1/main/cctv.migu.m3u"
        
        # 修正 cctv 文件：在每个 #EXTINF 行的 tvg-logo="..." 后面插入 ,group-title="央视专版",
        # 原始格式：#EXTINF:-1 tvg-id="CCTV1" tvg-name="CCTV1" tvg-logo="..."CCTV1
        # 目标格式：#EXTINF:-1 tvg-id="CCTV1" tvg-name="CCTV1" tvg-logo="...",group-title="央视专版",CCTV1
        sed -i 's/\(tvg-logo="[^"]*"\)/\1,group-title="央视专版",/' cctv_raw.m3u
        
        # 合并两个文件（去除重复的 #EXTM3U 头部）
        # 先写入 migu.m3u（保留其头部）
        head -1 migu.m3u | grep -q "^#EXTM3U" && has_header1=true || has_header1=false
        if [ "$has_header1" = true ]; then
          cat migu.m3u > new-iptv.m3u
        else
          echo "#EXTM3U" > new-iptv.m3u
          cat migu.m3u >> new-iptv.m3u
        fi
        
        # 追加修正后的 cctv 内容（去掉可能的 #EXTM3U 行）
        head -1 cctv_raw.m3u | grep -q "^#EXTM3U" && has_header2=true || has_header2=false
        if [ "$has_header2" = true ]; then
          tail -n +2 cctv_raw.m3u >> new-iptv.m3u
        else
          cat cctv_raw.m3u >> new-iptv.m3u
        fi
        
        # 计算哈希和统计信息
        NEW_HASH=$(sha256sum new-iptv.m3u | awk '{print $1}')
        echo "new_hash=$NEW_HASH" >> $GITHUB_OUTPUT
        FILESIZE=$(stat -f%z new-iptv.m3u 2>/dev/null || stat -c%s new-iptv.m3u)
        LINES=$(wc -l < new-iptv.m3u)
        echo "合并后文件大小: ${FILESIZE}字节, ${LINES}行"
        
        # 源文件行数（供邮件使用）
        LINES1=$(wc -l < migu.m3u)
        LINES2=$(wc -l < cctv_raw.m3u)
        echo "source1_lines=$LINES1" >> $GITHUB_OUTPUT
        echo "source2_lines=$LINES2" >> $GITHUB_OUTPUT
    
    - name: Compare files
      id: compare
      run: |
        if [ "${{ steps.hash_check.outputs.old_hash }}" == "${{ steps.download.outputs.new_hash }}" ]; then
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "changed=true" >> $GITHUB_OUTPUT
        fi
    
    - name: Update and push
      if: steps.compare.outputs.changed == 'true'
      run: |
        mv new-iptv.m3u iptv-fe.m3u
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add iptv-fe.m3u
        git commit -m "🔄 自动同步IPTV: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
        
        源文件1: migu.m3u (无修改)
        源文件2: cctv.migu.m3u (已自动添加 group-title=\"央视专版\")
        合并后哈希: ${{ steps.download.outputs.new_hash }}"
        git push origin main
   
    
    - name: Log no changes
      if: steps.compare.outputs.changed == 'false'
      run: |
        echo "⏭️ $(date -u '+%Y-%m-%d %H:%M:%S UTC') - 文件未变化，跳过更新"
